<head>
<meta charset="utf-8">

<title>Spirits List</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2a1f14;--mut:#7a6a58;--acc:#a85d12;--line:#e6dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110b;--card:#221a12;--ink:#f3e8d6;--mut:#a8977f;--acc:#e0933f;--line:#3a2e20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110b;--card:#221a12;--ink:#f3e8d6;--mut:#a8977f;--acc:#e0933f;--line:#3a2e20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif}
header{padding:28px 18px 8px;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:.04em}
header p{margin:6px 0 0;color:var(--mut);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px;z-index:5;border-bottom:1px solid var(--line)}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:8px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:640px;margin:0 auto;padding:0 14px 40px}
h2{margin:28px 0 0;font-size:22px;color:var(--acc);border-bottom:2px solid var(--acc);padding-bottom:4px}
h3{margin:18px 0 6px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:bold}
.price{color:var(--acc);white-space:nowrap}
.meta{font-size:13px;color:var(--mut);margin-top:2px}
.note{font-size:14px;margin-top:2px;font-style:italic}
footer{text-align:center;color:var(--mut);font-size:12px;padding:0 14px 30px}
</style>
</head>

const rows=D.split("\n").map(l=>{const p=l.split("|").map(s=>s.trim());const w=W.includes(p[1]);return{n:p[0],c:w?"Whisk(e)y":p[1],s:w?(["Australia","Sweden"].includes(p[1])?p[1]:p[1]+" · "+p[2]):p[2],a:p[3],y:p[4],p:p[5],f:p[6]}});

const chips=document.getElementById("chips"),q=document.getElementById("q"),list=document.getElementById("list");
["All",...order].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{cur=c;render()};chips.appendChild(b)});
function render(){
  [...chips.children].forEach(b=>b.classList.toggle("on",b.textContent===cur));
  const t=q.value.toLowerCase();let h="";
  order.forEach(c=>{
    if(cur!=="All"&&cur!==c)return;
    const rs=rows.filter(r=>r.c===c&&(r.n+r.f+r.s).toLowerCase().includes(t));
    if(!rs.length)return;
    h+="<h2>"+c+"</h2>";
    [...new Set(rs.map(r=>r.s))].forEach(s=>{
      h+="<h3>"+s+"</h3>";
      rs.filter(r=>r.s===s).sort((a,b)=>a.b.localeCompare(b.b)||a.p-b.p).forEach(r=>{
        const m=[r.a?r.a+" years":"",r.y?r.y:""].filter(Boolean).join(" · ");
        h+='<div class="item"><div class="row"><span>'+r.n+'</span><span class="price">$'+r.p+'</span></div>'+(m?'<div class="meta">'+m+'</div>':"")+'<div class="note">'+r.f+'</div></div>';
      });
    });
  });
  list.innerHTML=h||"<p>No matches.</p>";
}
