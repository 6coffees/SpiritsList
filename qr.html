<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Points at the folder this page lives in, i.e. your index.html list.
// To force a specific address (e.g. a custom domain), replace the next line with: const LIST_URL="https://yourdomain.com/";
const LIST_URL=new URL("./",location.href).href;
// ---- Look: change these to restyle the code (keep them dark so it still scans) ----
const COLOR_A="#d0125f", COLOR_B="#111111", BADGE_TEXT="PK";
//DRAW-START
function drawQR(n,isDark,canvas){
  const S=720,q=3,c=S/(n+2*q),ctx=canvas.getContext("2d");
  canvas.width=canvas.height=S;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,S,S);
  const g=ctx.createLinearGradient(0,0,S,S);g.addColorStop(0,COLOR_A);g.addColorStop(1,COLOR_B);
  ctx.fillStyle=g;ctx.strokeStyle=g;
  const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
  const inEye=(r,k)=>(r<7&&k<7)||(r<7&&k>=n-7)||(r>=n-7&&k<7);
  const B=Math.round(n*0.2)|1,b0=(n-B)/2;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
    if(inEye(r,k)||!isDark(r,k))continue;
    if(r>=b0-1&&r<b0+B+1&&k>=b0-1&&k<b0+B+1)continue;
    const x=(k+q)*c,y=(r+q)*c;rr(x+c*.04,y+c*.04,c*.92,c*.92,c*.36);ctx.fill();
  }
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{
    const x=(k+q)*c,y=(r+q)*c;
    ctx.lineWidth=c;rr(x+c/2,y+c/2,6*c,6*c,0);ctx.stroke();
    rr(x+2*c,y+2*c,3*c,3*c,0);ctx.fill();
  });
  const bx=(b0+q)*c,bs=B*c;
  ctx.fillStyle="#fff";rr(bx-c*.4,bx-c*.4,bs+c*.8,bs+c*.8,c*1.6);ctx.fill();
  ctx.fillStyle=g;rr(bx+c*.3,bx+c*.3,bs-c*.6,bs-c*.6,c*1.2);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold "+(bs*.42)+"px system-ui,Arial,sans-serif";
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(BADGE_TEXT,bx+bs/2,bx+bs/2+bs*.03);
}
//DRAW-END
function build(){
  const tmp=document.createElement("div");tmp.style.display="none";document.body.appendChild(tmp);
  const qr=new QRCode(tmp,{text:LIST_URL,width:256,height:256,correctLevel:QRCode.CorrectLevel.H});
  const o=qr._oQRCode,cv=document.createElement("canvas");
  drawQR(o.getModuleCount(),(r,k)=>o.isDark(r,k),cv);
  document.getElementById("qr").appendChild(cv);
  document.getElementById("dl").href=cv.toDataURL("image/png");
}
build();
</script>
